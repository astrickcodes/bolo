<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolo – बोलो</title>
<style>
:root{--bg:#1b1233;--card:#2a1d4d;--ink:#fff4e0;--mut:#b9a9e0;--a:#ff9f1c;--b:#2ec4b6;--c:#ff4d6d;--ok:#7bd88f}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
background-image:radial-gradient(circle at 15% 0,#3b2575 0,transparent 45%),radial-gradient(circle at 100% 100%,#5a1f4a 0,transparent 40%)}
.w{max-width:480px;margin:auto;padding:14px 14px 80px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:26px;font-weight:800;letter-spacing:1px}.logo span{color:var(--a)}
.pill{background:#ffffff1a;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;margin-left:6px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;padding:12px 4px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.tab.on{border-color:var(--lc);box-shadow:0 0 18px -4px var(--lc);background:linear-gradient(160deg,var(--card),#3a2a66)}
.tab small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.border{height:12px;margin:6px 0 14px;background:repeating-linear-gradient(90deg,var(--a) 0 10px,transparent 10px 14px,var(--b) 14px 24px,transparent 24px 28px,var(--c) 28px 38px,transparent 38px 42px);border-radius:6px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;border:1px solid #ffffff14}
.tile:active{transform:scale(.96)}.tile .e{font-size:34px}.tile b{display:block;margin-top:6px}.tile small{color:var(--mut)}
.prog{height:6px;background:#ffffff22;border-radius:4px;margin-top:8px}.prog i{display:block;height:100%;background:var(--lc);border-radius:4px}
.card{background:var(--card);border-radius:22px;padding:22px;margin:10px 0;border:1px solid #ffffff1a}
.flip{perspective:900px;height:260px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .fi{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.front{background:linear-gradient(145deg,#3a2a66,#2a1d4d);border:1px solid #ffffff22}.back{transform:rotateY(180deg);background:linear-gradient(145deg,var(--lc),#00000055);color:#fff}
.hi{font-size:30px;font-weight:700}.en{color:var(--mut);margin-top:6px}.ans{font-size:30px;font-weight:800}.alt{font-size:14px;opacity:.85;margin-top:10px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer;color:#1b1233;background:var(--a);margin:4px;box-shadow:0 4px 0 #0004}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.g{background:#ffffff22;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:#ffffff14;color:var(--ink);border:2px solid #ffffff22;border-radius:14px;padding:14px;margin:8px 0;font-size:17px;cursor:pointer}
.opt.ok{background:#1f6b3a;border-color:var(--ok)}.opt.no{background:#7a1f3a;border-color:var(--c)}
.cmp{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}.cmp .row{display:flex;gap:8px;align-items:baseline;margin:6px 0}
.cmp .l{width:62px;font-size:12px;font-weight:800;padding:3px 0;text-align:center;border-radius:8px;color:#1b1233}
.fact{background:#ffffff12;border-left:4px solid var(--b);padding:12px;border-radius:10px;font-size:14px;color:var(--mut);margin-top:16px}
.back-b{color:var(--mut);cursor:pointer;margin:6px 0;display:inline-block}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ok);color:#12301c;padding:10px 20px;border-radius:30px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}
a{color:var(--b)}
</style>
<div class=w id=app></div><div id=toast></div>
<script>
const T={"Words": ["🔤", "Pronouns & verbs", [["I", "मैं", "Hum", "Ham", "Hum"], ["He / She", "वह", "Uoo", "U", "Oo"], ["You", "तुम", "Tou", "Tu", "Tu"], ["Come", "आओ", "Aaooni", "Aa", "Aau"], ["Sit", "बैठो", "Baithni", "Baith", "Baith"], ["Eat", "खाओ", "Khooni", "Kho", "Kho"], ["Go", "जाओ", "Joni", "Jo", "Jo"], ["Walk", "चलो", "Chalni", "Chal", "Chal"], ["Drink", "पियो", "Peele", "Pi", "Peele"], ["Run", "दौड़ो", "Daud", "Daud", "Daur"]]], "Greet": ["🙏", "Greetings", [["How are you?", "आप कैसे हैं?", "Toharo ki haal?", "Tu kaisan chhe?", "Kaisan hen?"], ["I am fine.", "मैं ठीक हूँ।", "Hammein theek chhiye.", "Ham thik chhi.", "Hum theek hai."], ["What is your name?", "आपका नाम क्या है?", "Toharo naam ki choh?", "Tohar kathi naam hau?", "Tohar naam kauchi hau?"], ["Did you have lunch?", "खाना खाया?", "Ki toinh dopahar ke khana khailo?", "Tu dupahar ke khana kha lelahi?", "Tu duphar ke khana khaini?"]]], "Family": ["👨‍👩‍👧", "With family", [["Will you come with me?", "मेरे साथ आओगे?", "Ki toih hamra saathein aibho?", "Tu hamra sathe aaibe ki?", "Tu hamra saath aime?"], ["I shall come with you.", "मैं तुम्हारे साथ आऊँगा।", "Hamme tohra saathein aaibha.", "Ham tora sathe abau.", "Hum tohra saath aibau."], ["Will you give me your pen?", "अपनी कलम दोगे?", "Ki toinh aapno kalam hamra debho?", "Tu appan kalam hamra debe?", "Tu apan kalamiya hamra deme?"], ["Yes, of course.", "हाँ, ज़रूर।", "Haan, zaroor.", "Ha jarur.", "Haa, jaroor."], ["Do you love me?", "क्या तुम मुझसे प्यार करते हो?", "Ki Toinh hamra pyar karein chhay?", "Tu hamra se pyaar karai chhe?", "Tu hamra se prem karahen?"], ["Yes, I love you.", "हाँ, मैं तुमसे प्यार करता हूँ।", "Haan, hamme tohra pyar karein chhiyo.", "Ha, ham tora se pyar karai chhiyau.", "Haa, hum tohra se prem kara hu."]]], "Ask": ["❓", "Questions", [["Why did you come?", "तुम क्यों आए?", "Tau kathilah aaylo cheleh?", "Tu kathi la aile ha?", "Kahela aile hal?"], ["How did you come?", "तुम कैसे आए?", "Tau kainah aayle?", "Tu kaeese ailahi?", "Kaise ailin?"], ["Where did you sleep?", "तुम कहाँ सोए?", "Tau kahan suttalo cheleh?", "Tu kenne sutalahi?", "Kaha sutlahin?"], ["Where did you come from?", "तुम कहाँ से आए?", "Tau kahan sah aayloh cheh?", "Tu kanha se abai chhahi?", "Kaha se aawith hai?"], ["Where should I go?", "मैं कहाँ जाऊँ?", "Hummah kahan jaiyah?", "Hamra kanha jae ke chahi?", "Hamra kaha jai ke chahi?"], ["Which way did you come?", "किस रास्ते से आए?", "Kaun rasta sah tau aayleh?", "Tu kon rasta se ailahi?", "Kon rastaiya se alhin?"], ["How much did he pay you?", "उसने तुम्हें कितना दिया?", "Uoo tohra kitna delko?", "U tora ketana paisa delau?", "Oo tora ketna paisa delkau?"], ["What did you do?", "तुमने क्या किया?", "Tau ki kari dehleh?", "Tu kathi kaile?", "Tu kauchi kani?"], ["What should I do?", "मैं क्या करूँ?", "Hummara ki karma chahiyo?", "Ham kathi karu?", "Hame kauchi kari?"]]], "Tense": ["⏳", "Past & future", [["He ate an apple.", "उसने सेब खाया।", "Uoo ago seb khailke.", "U seb kha lelakai.", "Oo seu khail kai."], ["He has eaten.", "उसने खा लिया है।", "Uoo khay lelkey.", "U kha lelakai.", "Oo kha lelkai."], ["He slept the whole night.", "वह रात भर सोया।", "Uoo raat bhar suttalo cheleh.", "U rat bhar sutalai.", "Oo raat bhar sutalkai."], ["She came by bus yesterday.", "वह कल बस से आई।", "Uoo kal bus se aailey.", "U kalhe bas se alai.", "Oo kalhe bus se ailai."], ["He will eat.", "वह खाएगा।", "Uoo khaiyteh.", "U khatai.", "Oo khaitai."], ["He will go.", "वह जाएगा।", "Uoo jaiyteh.", "U jatai.", "Oo jaitai."], ["He will come.", "वह आएगा।", "Uoo aaiyteh.", "U atai.", "Oo aitau."]]]},FACTS=["Angika is also called Anga, or 'Chhika-Chhiki' – the nickname comes from its words for 'is' (chhik).", "Bajjika has historically been written in Kaithi script as well as Devanagari.", "Angika is spoken around Bhagalpur, Banka, Munger and parts of Jharkhand – and also in the Nepal Terai.", "Magahi (Magadhi) comes from the old Magadha region – Patna, Gaya, Nalanda.", "All three are close to Maithili; learn one and the others get easier."];
const LN=[['Angika','Anga · Bhagalpur','#ff9f1c',2],['Bajjika','North Bihar','#2ec4b6',3],['Magahi','Magadh · Patna/Gaya','#ff4d6d',4]];
let S=JSON.parse(localStorage.bolo||'{"xp":0,"streak":0,"day":"","mast":{},"ed":{}}');
const save=()=>localStorage.bolo=JSON.stringify(S);
const today=()=>new Date().toDateString();
if(S.day!=today()){let y=new Date(Date.now()-864e5).toDateString();S.streak=S.day==y?S.streak:0;}
let li=0,view='home',topic=null,idx=0,flipped=false,qs=0,qn=0,qdone=false;
const col=()=>LN[li][2];
const txt=(k,j,l)=>S.ed[k+'_'+j+'_'+l]||T[k][2][j][l];
const toast=m=>{let t=document.getElementById('toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1200)};
function xp(n){S.xp+=n;if(S.day!=today()){S.day=today();S.streak++}save()}
function bar(){return `<div class=bar><div class=logo>बोलो<span>.</span></div><div><span class=pill>🔥 ${S.streak}</span><span class=pill>⭐ ${S.xp}</span></div></div>`}
function tabs(){return `<div class=tabs>`+LN.map((l,i)=>`<div class="tab ${i==li?'on':''}" style="--lc:${l[2]}" onclick="li=${i};view='home';draw()">${l[0]}<small>${l[1].split(' · ')[0]}</small></div>`).join('')+`</div>`}
function mastery(k){let n=T[k][2].length,m=0;for(let i=0;i<n;i++)if(S.mast[k+i+'_'+li])m++;return m/n*100}
function draw(){let a=document.getElementById('app');document.body.style.setProperty('--lc',col());a.style.setProperty('--lc',col());
let h=bar()+tabs()+`<div class=border></div>`;
if(view=='home'){
 h+=`<div class=grid>`+Object.keys(T).map(k=>`<div class=tile style="--lc:${col()}" onclick="topic='${k}';view='learn';idx=0;flipped=false;draw()"><div class=e>${T[k][0]}</div><b>${T[k][1]}</b><small>${T[k][2].length} phrases</small><div class=prog><i style="width:${mastery(k)}%"></i></div></div>`).join('')+`
 <div class=tile style="--lc:${col()}" onclick="view='cmp';draw()"><div class=e>⚖️</div><b>Compare</b><small>all 3 side by side</small></div></div>
 <div class=fact>💡 ${FACTS[(new Date().getDate())%FACTS.length]}</div>
 <div class=fact style="border-color:var(--a)">Text is romanised from languageshome.com (native-speaker audio is on their site). Dialects vary by village – tap ✏️ on a card to fix it with your family's version.</div>`}
if(view=='learn'||view=='quiz'){h+=`<span class=back-b onclick="view='home';draw()">← Back</span> <b>${T[topic][1]}</b>`;
 let it=T[topic][2];
 if(view=='learn'){let r=it[idx];
 h+=`<div class=top><span>${idx+1} / ${it.length}</span><span>${LN[li][0]}</span></div>
 <div class="flip ${flipped?'f':''}" onclick="flipped=!flipped;if(flipped&&!S.mast[topic+idx+'_'+li]){S.mast[topic+idx+'_'+li]=1;xp(5);toast('+5 XP')}draw()"><div class=fi>
 <div class="face front"><div class=hi>${r[1]}</div><div class=en>${r[0]}</div><div class=en style="margin-top:20px;font-size:13px">tap to reveal ${LN[li][0]}</div></div>
 <div class="face back"><div class=ans>${txt(topic,idx,LN[li][3])}</div><div class=alt>${LN.map(l=>l[0].slice(0,3)+': '+txt(topic,idx,l[3])).filter((_,i)=>i!=li).join('  ·  ')}</div></div></div></div>
 <div style="text-align:center;margin-top:12px"><button class="btn g" onclick="idx=(idx+it.length-1)%it.length;flipped=false;draw()">◀</button>
 <button class="btn g" onclick="ed()">✏️</button><button class=btn onclick="idx=(idx+1)%it.length;flipped=false;draw()">Next ▶</button></div>
 <div style="text-align:center;margin-top:10px"><button class=btn onclick="view='quiz';qs=0;qn=0;qdone=false;newq();draw()">🎯 Quiz me</button></div>`}
 else{h+=quizHTML()}}
if(view=='cmp'){h+=`<span class=back-b onclick="view='home';draw()">← Back</span><b> Compare</b>`;
 Object.keys(T).forEach(k=>{h+=`<h3>${T[k][0]} ${T[k][1]}</h3>`;T[k][2].forEach((r,j)=>{h+=`<div class=cmp><div style="font-weight:700">${r[1]} <span style="color:var(--mut);font-weight:400">· ${r[0]}</span></div>`+LN.map(l=>`<div class=row><span class=l style="background:${l[2]}">${l[0].slice(0,3).toUpperCase()}</span><span>${txt(k,j,l[3])}</span></div>`).join('')+`</div>`})})}
a.innerHTML=h}
function ed(){let l=LN[li][3];let v=prompt('Your family\'s version of "'+T[topic][2][idx][0]+'":',txt(topic,idx,l));if(v){S.ed[topic+'_'+idx+'_'+l]=v;save();draw()}}
let q;function newq(){let it=T[topic][2];let a=Math.floor(Math.random()*it.length),o=[a];let g=0;while(o.length<Math.min(4,it.length)&&g++<50){let r=Math.floor(Math.random()*it.length);if(!o.includes(r))o.push(r)}o.sort(()=>Math.random()-.5);q={a,o,done:null}}
function quizHTML(){if(qn>=8)return `<div class=card style="text-align:center"><div style="font-size:50px">🏆</div><h2>${qs} / ${qn}</h2><button class=btn onclick="qs=0;qn=0;newq();draw()">Again</button><button class="btn g" onclick="view='learn';draw()">Cards</button></div>`;
 let it=T[topic][2];return `<div class=top><span>Question ${qn+1}/8</span><span>Score ${qs}</span></div><div class=card><div class=en>How do you say…</div><div class=hi>${it[q.a][1]}</div><div class=en>${it[q.a][0]}</div></div>`+
 q.o.map(r=>`<button class="opt ${q.done!=null?(r==q.a?'ok':(r==q.done?'no':'')):''}" ${q.done!=null?'disabled':''} onclick="pick(${r})">${txt(topic,r,LN[li][3])}</button>`).join('')+(q.done!=null?`<button class=btn onclick="qn++;newq();draw()">Continue</button>`:'')}
function pick(r){q.done=r;if(r==q.a){qs++;xp(10);toast('✔ +10 XP')}else toast('✖ Not quite');draw()}
draw()
</script></html>
